<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Monster's Point of View</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #scenes {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      pointer-events: none;
      user-select: none;
    }

    .scene.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      z-index: 2;
    }

    .scene.inactive {
      opacity: 0;
      transform: scale(1.2);
      pointer-events: none;
      z-index: 1;
    }


.action-btn {
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
      z-index: 100;
    }

    .action-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .action-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Nav buttons for scenes */
    .nav-buttons {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
      width: 100%;
      justify-content: center;
    }

    .nav-btn {
      padding: 14px 34px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
    }

    .nav-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .nav-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .prev-btn { background: rgba(108, 117, 125, 0.7); border-color: rgba(200, 200, 200, 0.4); }
    .prev-btn:hover { background: rgba(130, 140, 150, 0.85); }
    .next-btn { background: rgba(46, 139, 87, 0.7); border-color: rgba(100, 200, 150, 0.4); }
    .next-btn:hover { background: rgba(60, 170, 100, 0.85); }
    .skip-btn { background: rgba(100, 100, 100, 0.5); border-color: rgba(200, 200, 200, 0.3); }
    .skip-btn:hover { background: rgba(140, 140, 140, 0.7); }

    /* Choice buttons for scene 3 */
    .choice-buttons {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      z-index: 20;
      justify-content: center;
      max-width: 700px;
    }

    .choice-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
    }

    .choice-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      background: rgba(40, 100, 200, 0.7);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .choice-btn:active {
      transform: translateY(1px);
    }

    /* Scene-specific backgrounds */
    #scene-title {
      background: #0a0a0a;
      overflow: hidden;
    }
    #scene-title .title-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #scene-title .title-bg:nth-child(1) { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('assets/scene1.jpg'); background-size: cover; background-position: center; animation: titleFade1 28s ease-in-out infinite; }
    #scene-title .title-bg:nth-child(2) { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('assets/scene2.jpg'); background-size: cover; background-position: center; animation: titleFade2 28s ease-in-out infinite; }
    #scene-title .title-bg:nth-child(3) { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('assets/scene3.jpg'); background-size: cover; background-position: center; animation: titleFade3 28s ease-in-out infinite; }
    #scene-title .title-bg:nth-child(4) { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('assets/scene4.jpeg'); background-size: cover; background-position: center; animation: titleFade4 28s ease-in-out infinite; }
    @keyframes titleFade1 { 0%, 100% { opacity: 1; } 17% { opacity: 1; } 21% { opacity: 0; } }
    @keyframes titleFade2 { 0% { opacity: 0; } 21% { opacity: 0; } 25% { opacity: 1; } 38% { opacity: 1; } 42% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes titleFade3 { 0% { opacity: 0; } 42% { opacity: 0; } 46% { opacity: 1; } 59% { opacity: 1; } 63% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes titleFade4 { 0% { opacity: 0; } 63% { opacity: 0; } 67% { opacity: 1; } 80% { opacity: 1; } 84% { opacity: 0; } 100% { opacity: 0; } }
    .title-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
    }
    .title-text {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 4.5rem);
      color: #f0e6d3;
      text-shadow: 0 0 40px rgba(0,0,0,0.9), 0 4px 20px rgba(0,0,0,0.8);
      letter-spacing: 4px;
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .start-btn {
      padding: 18px 50px;
      font-size: 1.2rem;
      letter-spacing: 3px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.5);
    }
    #scene-1 {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('assets/scene1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #scene-2 {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('assets/scene2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #scene-3 {
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('assets/scene3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background 0.6s ease;
    }
    #scene-4 {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('assets/scene4.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #scene-5 {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('assets/scene5.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #scene-6 { background: linear-gradient(135deg, #4a3728, #6b4c32); }
    #scene-7 { background: linear-gradient(135deg, #5c3d2e, #8b5e3c); }
    #scene-8 { background: linear-gradient(135deg, #1a1a2e, #2d1b1b); }
    #scene-9 { background: linear-gradient(135deg, #3a1c1c, #1a0e0e); }
    #scene-8b { background: linear-gradient(135deg, #3a1717, #1c0f0f); }
    #scene-10 { background: linear-gradient(135deg, #0d1321, #1d2d44); }
    #scene-11 { background: linear-gradient(135deg, #0b0b12, #161622); }
    #scene-12 { background: linear-gradient(135deg, #050507, #0a0a0f); }
    #scene-9 .story-text { color: #f5dcdc; }
    #scene-8b .story-text { color: #f2dede; }
    #scene-10 .story-text { color: #c9d6e8; }
    #scene-11 .story-text { color: #b8b8c8; }
    #scene-12 .story-text { color: #d8d8e0; }
    /* Cottage window light (placeholder) used in the flee scene */
    .cottage-light {
      position: absolute;
      top: 42%;
      left: 72%;
      width: 110px;
      height: 85px;
      background: radial-gradient(circle, rgba(255,205,100,0.95), rgba(255,160,40,0.4) 55%, rgba(255,120,0,0) 75%);
      border-radius: 10px;
      box-shadow: 0 0 60px 20px rgba(255,170,60,0.5);
      transition: transform 1s ease, opacity 1s ease, box-shadow 1s ease;
      z-index: 5;
      pointer-events: none;
    }
    #scene-helper {
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('assets/scene5.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Intro scenes (disclaimer & context) */
    #scene-disclaimer,
    #scene-context {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85));
      text-align: center;
    }
    #scene-disclaimer .story-container,
    #scene-context .story-container {
      width: auto;
      max-width: 750px;
      left: 50%;
      transform: translateX(-50%);
    }
    #scene-disclaimer .story-text,
    #scene-context .story-text {
      color: #d4c5a9;
      font-family: "Georgia", "Times New Roman", serif;
      font-weight: 400;
      text-align: center;
      margin: 0 auto;
    }
    .intro-continue-btn {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: none;
    }

    /* Final fade-to-black overlay */
    #fade-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fade-overlay.show { opacity: 1; pointer-events: auto; }
    #fade-overlay .closing-line {
      color: #6a6a7a;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(1.1rem, 2.2vw, 1.8rem);
      letter-spacing: 2px;
      line-height: 1.6;
      text-align: center;
      padding: 0 24px;
      opacity: 0;
      transition: opacity 2s ease 1.2s;
    }
    #fade-overlay.show .closing-line { opacity: 1; }

    /* Story text / typewriter */
    .story-container {
      position: absolute;
      top: 30vh;
      left: 8%;
      right: 8%;
      z-index: 20;
      max-width: 700px;
    }

    .story-text {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      line-height: 1.7;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.6);
      font-weight: 600;
      margin: 0;
      white-space: pre-wrap;
      letter-spacing: 0.5px;
      text-align: left;
    }

    #scene-1 .story-text { color: #f5e6d3; }
    #scene-2 .story-text { color: #e8f5e9; }
    #scene-4 .story-text { color: #fffde7; }
    #scene-5 .story-text { color: #fce4ec; }
    #scene-helper .story-text { color: #e0e0e0; }
  </style>
</head>
<body>

  <div id="scenes">
    <!-- Scene 0: Title -->
    <div class="scene active" id="scene-title">
      <div class="title-bg"></div>
      <div class="title-bg"></div>
      <div class="title-bg"></div>
      <div class="title-bg"></div>
      <div class="title-content">

    <div class="scene inactive" id="scene-2">
      <div class="story-container">
        <p class="story-text" id="story-2"></p>
      </div>
      <div class="nav-buttons">
        <button class="nav-btn prev-btn" onclick="goPrevious()">◀ Previous</button>
        <button class="nav-btn next-btn" onclick="goNext()">Next ▶</button>

      <div class="story-container">
        <p class="story-text" id="story-3"></p>
      </div>
      <div class="choice-buttons" id="choice-buttons-3">

      <div class="story-container">
        <p class="story-text" id="story-4"></p>
      </div>
      <div class="nav-buttons">
        <button class="nav-btn prev-btn" onclick="goPrevious()">◀ Previous</button>
        <button class="nav-btn next-btn" onclick="goNext()">Next ▶</button>
      </div>

  <div class="audio-controls">
    <button class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊 Unmute</button>
    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.1" value="0.7" onchange="setVolume(this.value)">
  </div>

  <audio id="scene1-audio" src="assets/scene1audio.mp3" loop preload="auto"></audio>

  <script>
    const sceneTitle = document.getElementById('scene-title');
    const muteBtn = document.getElementById('mute-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const scene1AudioEl = document.getElementById('scene1-audio');
    let transitioning = false;
    let isMuted = false;
    let audioStarted = false;

    let audioCtx;
    let masterGain;
    let clickBuffer;
    let typewriterBuffer;
    let scene1Audio;

    function initAudio() {
      if (audioStarted) return;
      audioStarted = true;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = isMuted ? 0 : 0.7;
      masterGain.connect(audioCtx.destination);
      createClickBuffer();
      createTypewriterBuffer();
      console.log('Web Audio initialized');
      scene1Audio = scene1AudioEl;
      scene1Audio.volume = isMuted ? 0 : parseFloat(volumeSlider.value);
      scene1Audio.muted = isMuted;
      scene1Audio.play().catch(e => { console.log('Audio play failed:', e); });
      updateMuteUI();
    }

    function createClickBuffer() {
      const s = audioCtx.sampleRate, len = s * 0.12;
      const buf = audioCtx.createBuffer(1, len, s);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i/s * 50) * 0.4;
      clickBuffer = buf;
    }

    function createTypewriterBuffer() {
      const s = audioCtx.sampleRate, len = s * 0.05;
      const buf = audioCtx.createBuffer(1, len, s);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i/s * 100) * 0.12;
      typewriterBuffer = buf;
    }

      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      src.connect(g); g.connect(masterGain); src.start();
    }

    function typeWriter(id, text, speed = 40, onComplete) {
      const el = document.getElementById(id);
      el.textContent = '';
      let i = 0;
      function type() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          if (typewriterBuffer && audioCtx && !isMuted) {
            const src = audioCtx.createBufferSource();
            src.buffer = typewriterBuffer;
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(0.08, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            src.connect(g); g.connect(masterGain); src.start();
          }
          i++;
          typewriterTimer = setTimeout(type, speed);
        } else if (onComplete) {
          onComplete();
        }
      }
      type();
    }

    };

    function makeBeatingChoice(choice) {
      if (transitioning) return;
      transitioning = true;
      clearTimeout(typewriterTimer);
      playClickSound();
      initAudio();

      document.querySelectorAll('#choice-buttons-9 .choice-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(choice)) {
          btn.style.opacity = '0.5'; btn.style.cursor = 'default';
          btn.style.pointerEvents = 'none'; btn.textContent = '✓ ' + btn.textContent.trim();
        }
      });

      const choiceBtns = document.getElementById('choice-buttons-9');
      choiceBtns.style.display = 'none';
      const storyEl = document.getElementById('story-9');
      storyEl.textContent = '';
      const scene9 = document.getElementById('scene-9');
      scene9.style.background = beatingChoiceBackgrounds[choice];
      typeWriter('story-9', beatingChoiceResponses[choice], 35);

      setTimeout(() => {
        const contBtn = document.createElement('button');
        contBtn.className = 'action-btn nav-btn next-btn';
        contBtn.textContent = 'Continue →';
        contBtn.style.position = 'absolute'; contBtn.style.bottom = '10vh';
        contBtn.style.left = '50%'; contBtn.style.transform = 'translateX(-50%)'; contBtn.style.zIndex = '30';
        contBtn.onclick = () => {
          clearTimeout(typewriterTimer);
          contBtn.remove();
          startFleeScene();
        };
        document.getElementById('scene-9').appendChild(contBtn);
        transitioning = false;
      }, 2000);
    }

    // Scene 10 - Fleeing: click deeper into the dark until the window light vanishes
    let fleeClicks = 0;
    const FLEE_MAX_CLICKS = 3;

    function startFleeScene() {
      const light = document.getElementById('cottage-light');
      if (light) {
        light.style.transition = 'none';
        light.style.opacity = '1';
        light.style.transform = 'scale(1)';
        light.style.boxShadow = '0 0 60px 20px rgba(255,170,60,0.5)';
        void light.offsetWidth;
        light.style.transition = 'transform 1s ease, opacity 1s ease, box-shadow 1s ease';
      }
      fleeClicks = 0;
      const fleeControls = document.getElementById('flee-controls');
      if (fleeControls) {
        fleeControls.innerHTML = '';
        const fleeBtn = document.createElement('button');
        fleeBtn.className = 'nav-btn next-btn';
        fleeBtn.id = 'flee-btn';
        fleeBtn.textContent = '▶ Deeper into the dark';
        fleeBtn.onclick = advanceFlee;
        fleeControls.appendChild(fleeBtn);
      }
      goToScene('scene-10');
    }

    function advanceFlee() {
      if (transitioning) return;
      playClickSound();
      fleeClicks++;
      const light = document.getElementById('cottage-light');
      if (fleeClicks >= FLEE_MAX_CLICKS) {
        if (light) { light.style.opacity = '0'; light.style.transform = 'scale(0.15)'; light.style.boxShadow = 'none'; }
        const fleeControls = document.getElementById('flee-controls');
        if (fleeControls) {
          fleeControls.innerHTML = '';
          const contBtn = document.createElement('button');
          contBtn.className = 'nav-btn next-btn';
          contBtn.textContent = 'Continue →';
          contBtn.onclick = () => { goToScene('scene-11'); };
          fleeControls.appendChild(contBtn);
        }
      } else if (light) {
        const s = 1 - fleeClicks * 0.3;
        light.style.transform = `scale(${s})`;
        light.style.opacity = `${1 - fleeClicks * 0.35}`;
      }
    }

    // Scene 12 - Breaking the fourth wall: final fade to black
    const endLines = {
      close: "The door is closed. The dark does not answer. It only waits.",
      dark: "You step into the dark. It does not answer. It only closes."
    };

    // Scene 12 entry: hide final buttons until the monologue lands, then reveal
    function goToFinalScene() {
      const btns = document.getElementById('choice-buttons-12');
      if (btns) btns.style.display = 'none';
      goToScene('scene-12');
      setTimeout(() => { if (btns) btns.style.display = 'flex'; }, storyTexts[12].length * 40 + 500);
    }

    function endStory(choice) {
      playClickSound();
      const overlay = document.getElementById('fade-overlay');
      const closing = document.getElementById('closing-line');
      if (closing) closing.textContent = endLines[choice] || "The dark does not answer. It only closes.";
      if (overlay) overlay.classList.add('show');
    }
  </script>
</body>
